<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | GardenGo Admin</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
  <meta name="theme-color" content="#1B5E20">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin login-page">
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="loginTitle">
      <img class="login-logo" src="{{ url_for('static', filename='img/logo.png') }}" width="104" height="104" alt="Gripalda's Garden logo">
      <p class="login-brand">Garden<b>Go</b> <small>Admin</small></p>
      <h1 id="loginTitle">Admin login</h1>
      <p class="muted">For Gripalda's Garden staff only.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-info mb-2">{{ message }}</div>{% endfor %}{% endwith %}
      <form method="post" action="{{ url_for('admin.login', next=request.args.get('next')) }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label for="email" class="form-label">Email</label><input type="email" id="email" name="email" value="{{ email }}" class="form-control" autocomplete="username" maxlength="120"></div>
        <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" name="password" class="form-control" autocomplete="current-password"></div>
        {% if error %}<div class="alert alert-danger py-2" role="alert">{{ error }}</div>{% endif %}
        <button type="submit" class="btn btn-green w-100">Log in</button>
      </form>
    </section>
  </main>
</body>
</html>
